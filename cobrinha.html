<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game Pro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1a0b2e, #3d1a5c);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 20px;
    }

  .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 25px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(139, 92, 246, 0.4);
      border: 1px solid rgba(168, 85, 247, 0.3);
      max-width: 600px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(236, 72, 153, 0.8);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 15px rgba(236, 72, 153, 0.8); }
      to { text-shadow: 0 0 25px rgba(236, 72, 153, 1), 0 0 35px rgba(168, 85, 247, 0.6); }
    }

  .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

  .stats h2 {
      font-size: 1rem;
      color: #c084fc;
    }

    #score, #highScore, #level {
      font-size: 1.3rem;
      font-weight: bold;
      color: #fff;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(20, 24px);
      grid-template-rows: repeat(20, 24px);
      gap: 2px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px;
      border-radius: 12px;
      border: 2px solid #7c3aed;
      margin: 0 auto 15px auto;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

  .cell {
      width: 24px;
      height: 24px;
      background: rgba(124, 58, 237, 0.05);
      border-radius: 4px;
      transition: background 0.1s ease;
      position: relative;
    }

  .snake {
      background: #a855f7;
      box-shadow: 0 0 10px #a855f7, inset 0 0 5px rgba(255,255,255,0.3);
      border-radius: 6px;
      z-index: 2;
    }

  .snake-head {
      background: #ec4899;
      box-shadow: 0 0 15px #ec4899, inset 0 0 8px rgba(255,255,255,0.5);
    }

  .food {
      background: #fbbf24;
      box-shadow: 0 0 15px #fbbf24;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
      z-index: 2;
    }

  .food-special {
      background: #10b981;
      box-shadow: 0 0 20px #10b981;
      animation: pulseSpecial 0.6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); }
      to { transform: scale(1.1); }
    }

    @keyframes pulseSpecial {
      from { transform: scale(0.8) rotate(0deg); }
      to { transform: scale(1.2) rotate(180deg); }
    }

  .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #fbbf24;
      border-radius: 50%;
      pointer-events: none;
      animation: particleAnim 0.5s ease-out forwards;
      z-index: 5;
    }

    @keyframes particleAnim {
      to {
        transform: translate(var(--tx), var(--ty)) scale(0);
        opacity: 0;
      }
    }

    p {
      color: #c4b5fd;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    #gameOver {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 11, 46, 0.98);
      border-radius: 20px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #gameOver h2 {
      font-size: 3rem;
      color: #f43f5e;
      text-shadow: 0 0 20px rgba(244, 63, 94, 0.8);
      margin-bottom: 10px;
    }

    #gameOver p {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 15px;
    }

    button, select {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      border: none;
      padding: 10px 25px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.5);
      margin: 5px;
    }

    button:hover, select:hover {
      background: linear-gradient(135deg, #ec4899, #fbbf24);
      box-shadow: 0 5px 25px rgba(236, 72, 153, 0.7);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    select {
      padding: 8px 15px;
    }

  .wrapper {
      position: relative;
    }

  .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

  .mobile-controls {
      display: none;
      margin-top: 15px;
    }

  .arrow-btn {
      width: 55px;
      height: 55px;
      border-radius: 10px;
      background: rgba(168, 85, 247, 0.2);
      border: 2px solid #a855f7;
      color: #c084fc;
      font-size: 1.4rem;
      cursor: pointer;
      margin: 3px;
      transition: all 0.2s ease;
    }

  .arrow-btn:active {
      background: #a855f7;
      color: #1a0b2e;
      transform: scale(0.95);
    }

  .settings {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

  .toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #c084fc;
      font-size: 0.85rem;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #a855f7;
    }

    @media (max-width: 650px) {
      #board {
        grid-template-columns: repeat(20, 16px);
        grid-template-rows: repeat(20, 16px);
      }
   .cell {
        width: 16px;
        height: 16px;
      }
   .mobile-controls {
        display: block;
      }
      h1 {
        font-size: 2rem;
      }
   .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🐍 SNAKE PRO</h1>
    <div class="stats">
      <h2>Pontos: <span id="score">0</span></h2>
      <h2>Recorde: <span id="highScore">0</span></h2>
      <h2>Level: <span id="level">1</span></h2>
    </div>

    <div class="settings">
      <select id="difficulty">
        <option value="150">Fácil</option>
        <option value="110" selected>Médio</option>
        <option value="80">Difícil</option>
        <option value="50">Insano</option>
      </select>
      <label class="toggle">
        <input type="checkbox" id="wrapWalls"> Atravessar paredes
      </label>
    </div>

    <div class="controls">
      <button id="pauseBtn" onclick="togglePause()">Pausar</button>
      <button onclick="restartGame()">Resetar</button>
    </div>

    <div class="wrapper">
      <div id="gameOver">
        <h2>Game Over!</h2>
        <p>Pontuação: <span id="finalScore">0</span></p>
        <p>Level alcançado: <span id="finalLevel">1</span></p>
        <button onclick="restartGame()">Jogar Novamente</button>
      </div>

      <div id="board"></div>
    </div>

    <p>PC: Setas/WASD | Espaço = Pausar | Comida verde = 50pts</p>

    <div class="mobile-controls">
      <button class="arrow-btn" data-dir="UP">▲</button>
      <div>
        <button class="arrow-btn" data-dir="LEFT">◄</button>
        <button class="arrow-btn" data-dir="DOWN">▼</button>
        <button class="arrow-btn" data-dir="RIGHT">►</button>
      </div>
    </div>
  </div>

  <script>
    const BOARD_SIZE = 20;
    const boardElement = document.getElementById("board");
    const scoreElement = document.getElementById("score");
    const highScoreElement = document.getElementById("highScore");
    const levelElement = document.getElementById("level");
    const gameOverElement = document.getElementById("gameOver");
    const finalScoreElement = document.getElementById("finalScore");
    const finalLevelElement = document.getElementById("finalLevel");
    const pauseBtn = document.getElementById("pauseBtn");
    const difficultySelect = document.getElementById("difficulty");
    const wrapWallsCheckbox = document.getElementById("wrapWalls");

    let snake, direction, nextDirection, food, score, level, gameRunning, gamePaused, gameInterval;
    let cells = [];
    let currentSpeed = 110;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let specialFoodTimer = 0;

    highScoreElement.textContent = highScore;

    function createBoard() {
      boardElement.innerHTML = "";
      cells = [];
      for (let row = 0; row < BOARD_SIZE; row++) {
        cells[row] = [];
        for (let col = 0; col < BOARD_SIZE; col++) {
          const cell = document.createElement("div");
          cell.classList.add("cell");
          boardElement.appendChild(cell);
          cells[row][col] = cell;
        }
      }
    }

    function randomFood() {
      let newFood;
      const isSpecial = Math.random() < 0.15; // 15% chance de comida especial

      while (true) {
        newFood = {
          x: Math.floor(Math.random() * BOARD_SIZE),
          y: Math.floor(Math.random() * BOARD_SIZE),
          special: isSpecial
        };
        const collision = snake.some(part => part.x === newFood.x && part.y === newFood.y);
        if (!collision) break;
      }
      return newFood;
    }

    function createParticles(x, y, color) {
      const rect = boardElement.getBoundingClientRect();
      const cellSize = rect.width / BOARD_SIZE;

      for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = (x * cellSize + cellSize/2) + 'px';
        particle.style.top = (y * cellSize + cellSize/2) + 'px';
        particle.style.background = color;
        particle.style.setProperty('--tx', (Math.random() - 0.5) * 60 + 'px');
        particle.style.setProperty('--ty', (Math.random() - 0.5) * 60 + 'px');
        boardElement.appendChild(particle);
        setTimeout(() => particle.remove(), 500);
      }
    }

    function drawBoard() {
      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          cells[row][col].className = "cell";
        }
      }

      snake.forEach((part, index) => {
        if (index === 0) {
          cells[part.y][part.x].classList.add("snake", "snake-head");
        } else {
          cells[part.y][part.x].classList.add("snake");
        }
      });

      if (food.special) {
        cells[food.y][food.x].classList.add("food", "food-special");
      } else {
        cells[food.y][food.x].classList.add("food");
      }
    }

    function moveSnake() {
      if (!gameRunning || gamePaused) return;

      direction = nextDirection;
      const head = {...snake[0] };

      switch (direction) {
        case "UP": head.y--; break;
        case "DOWN": head.y++; break;
        case "LEFT": head.x--; break;
        case "RIGHT": head.x++; break;
      }

      // Modo atravessar paredes
      if (wrapWallsCheckbox.checked) {
        if (head.x < 0) head.x = BOARD_SIZE - 1;
        if (head.x >= BOARD_SIZE) head.x = 0;
        if (head.y < 0) head.y = BOARD_SIZE - 1;
        if (head.y >= BOARD_SIZE) head.y = 0;
      } else {
        if (head.x < 0 || head.x >= BOARD_SIZE || head.y < 0 || head.y >= BOARD_SIZE) {
          gameOver();
          return;
        }
      }

      if (snake.some(part => part.x === head.x && part.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        const points = food.special? 50 : 10;
        score += points;
        scoreElement.textContent = score;
        createParticles(food.x, food.y, food.special? '#10b981' : '#fbbf24');

        // Sistema de level
        const newLevel = Math.floor(score / 100) + 1;
        if (newLevel > level) {
          level = newLevel;
          levelElement.textContent = level;
          if (currentSpeed > 40) {
            currentSpeed -= 8;
            clearInterval(gameInterval);
            gameInterval = setInterval(moveSnake, currentSpeed);
          }
        }

        food = randomFood();
      } else {
        snake.pop();
      }

      drawBoard();
    }

    function gameOver() {
      gameRunning = false;
      gamePaused = false;
      clearInterval(gameInterval);

      if (score > highScore) {
        highScore = score;
        highScoreElement.textContent = highScore;
        localStorage.setItem('snakeHighScore', highScore);
      }

      finalScoreElement.textContent = score;
      finalLevelElement.textContent = level;
      gameOverElement.style.display = "flex";
      pauseBtn.disabled = true;
    }

    function togglePause() {
      if (!gameRunning) return;
      gamePaused =!gamePaused;
      pauseBtn.textContent = gamePaused? 'Continuar' : 'Pausar';
    }

    function restartGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];

      direction = "RIGHT";
      nextDirection = "RIGHT";
      score = 0;
      level = 1;
      currentSpeed = parseInt(difficultySelect.value);
      scoreElement.textContent = score;
      levelElement.textContent = level;
      food = randomFood();
      gameRunning = true;
      gamePaused = false;
      gameOverElement.style.display = "none";
      pauseBtn.disabled = false;
      pauseBtn.textContent = 'Pausar';

      drawBoard();
      clearInterval(gameInterval);
      gameInterval = setInterval(moveSnake, currentSpeed);
    }

    function changeDirection(dir) {
      if (!gameRunning || gamePaused) return;

      if (dir === "UP" && direction!== "DOWN") nextDirection = "UP";
      if (dir === "DOWN" && direction!== "UP") nextDirection = "DOWN";
      if (dir === "LEFT" && direction!== "RIGHT") nextDirection = "LEFT";
      if (dir === "RIGHT" && direction!== "LEFT") nextDirection = "RIGHT";
    }

    document.addEventListener("keydown", e => {
      if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
          e.preventDefault();
      }

      switch (e.key) {
        case "ArrowUp":
        case "w":
        case "W":
          changeDirection("UP");
          break;
        case "ArrowDown":
        case "s":
        case "S":
          changeDirection("DOWN");
          break;
        case "ArrowLeft":
        case "a":
        case "A":
          changeDirection("LEFT");
          break;
        case "ArrowRight":
        case "d":
        case "D":
          changeDirection("RIGHT");
          break;
        case " ":
          togglePause();
          break;
      }
    });

    document.querySelectorAll('.arrow-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        changeDirection(btn.dataset.dir);
      });
    });

    difficultySelect.addEventListener('change', () => {
      if (gameRunning) restartGame();
    });

    createBoard();
    restartGame();
  </script>
</body>
</html>
