<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Pet Digital - Final</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            /* Transição suave para o fundo */
            transition: background-image 1.5s ease-in-out, background-color 1.5s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        #petImg {
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
        }
    </style>
</head>

<body id="meuBody" class="min-h-screen flex flex-col transition-all duration-1000">

    <div class="w-full flex items-center justify-start p-4 gap-4 bg-white/20 backdrop-blur-lg shadow-md">
        <div class="avatar">
            <div class="w-16 rounded-full ring ring-secondary ring-offset-base-100 ring-offset-2">
                <img id="avatarImg" src="b_n.png" alt="Avatar" />
            </div>
        </div>
        
        <div class="flex flex-col gap-1">
            <input type="text" placeholder="Nome da criatura..." class="input input-secondary input-sm bg-white/60" />
            <progress id="barraFome" class="progress progress-secondary w-40" value="100" max="100"></progress>
        </div>
        
        <div class="ml-auto flex flex-col items-center gap-1">
            <span id="labelCiclo" class="text-xs font-bold uppercase">Dia</span>
            <input type="checkbox" class="toggle toggle-lg toggle-secondary" onchange="alternarCicloManual()" id="toggleClima" />
        </div>
    </div>

    <div class="flex flex-col items-center justify-center flex-grow w-full px-4">
        <div class="relative group">
            <img id="petImg" src="b_n.png" class="w-full max-w-md h-auto transition-transform duration-300" />
        </div>

        <div class="mt-10 flex justify-center w-full">
            <button onclick="alimentar()" class="hover:scale-110 active:scale-90 transition-transform cursor-pointer bg-transparent border-none">
                <img id="btnAlimentar" src="btn.png" class="w-32 h-auto" alt="Comida" />
            </button>
        </div>
    </div>
</body>
</html>
