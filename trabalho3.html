    <h2>Nomes Estranhos da Computação</h2>

    <article>
        <h3>Spam vem de um presunto</h3>
        <p>
            O termo "spam" para emails indesejados vem de um esquete do
            <strong>Monty Python</strong> onde a palavra SPAM (marca de presunto enlatado)
            era repetida incessantemente.
        </p>
    </article>

    <article>
        <h3>Bluetooth tem nome viking</h3>
        <p>
            A tecnologia foi nomeada em homenagem ao rei
            <em>Harald "Bluetooth" Gormsson</em>, que unificou a Dinamarca.
            A ideia era “unificar dispositivos”.
        </p>
    </article>

    <article>
        <h3>Bug é literalmente bug</h3>
        <p>
            O famoso inseto encontrado no computador
            <abbr title="Harvard Mark II">Mark II</abbr> em 1947
            era uma mariposa de verdade.
        </p>

    <article>
        <h3>O Excel 97 tinha um simulador de voo escondido</h3>

            O Microsoft Excel 97 escondia um jogo 3D estilo simulador de voo
            dentro da planilha.
        </p>
        <details>
            <summary>Como ativava?</summary>
            <p>Era preciso selecionar células específicas e usar combinações absurdas de teclado.</p>
        </details>
    </article>
<br>
    <article>
        <h3>O Google tem um T-Rex escondido</h3>
        <p>
            Quando você fica sem internet no Chrome, aparece um dinossauro.
            Se apertar espaço, começa um jogo infinito.
        </p>
    </article>

    <article>
        <h3>O Windows 95 tinha créditos escondidos</h3>
        <p>
            Desenvolvedores colocaram seus nomes escondidos dentro do sistema.
        </p>
    </article>

    <article>
        <h3>O GitHub já teve um unicórnio voador</h3>

            Em versões antigas, existia um modo visual alternativo escondido.
        </p>
    </article>

</section>



<section id="bugs-absurdos">

    <h2>Bugs Absurdos da História</h2>

    <article>
        <h3>O bug que destruiu um foguete em 37 segundos</h3>
        <p>
            Em 1996, o foguete Ariane 5 explodiu por causa de uma conversão de número
            de 64 bits para 16 bits.
        </p>
        <blockquote>
            Custo do erro: aproximadamente 370 milhões de dólares.
        </blockquote>
    </article>

    <article>
        <h3>O Y2K (Bug do Milênio)</h3>
        <p>
            Sistemas antigos usavam apenas dois dígitos para o ano.
            Em 2000, poderiam interpretar "00" como 1900.
        </p>
        <p>
            O mundo gastou bilhões se preparando... e quase nada aconteceu.
        </p>
    </article>

    <article>
        <h3>O bug do Pentium</h3>
        <p>
            Um erro microscópico na divisão de números em processadores Intel
            causava resultados errados em cálculos específicos.
        </p>
    </article>

    <article>
        <h3>O erro que duplicou dinheiro</h3>
        <p>
            Em 2012, um bug em um banco permitiu que clientes sacassem valores inexistentes.
        </p>
    </article>

</section>
